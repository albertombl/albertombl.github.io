<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font:16px/1.55 system-ui,sans-serif;margin:0;background:#f5f8fa;color:#203044}main{max-width:950px;margin:35px auto;padding:0 20px}a{color:#126b76}header{padding:16px 24px;background:white;border-bottom:1px solid #dce4ec}h1{font-size:clamp(1.7rem,4vw,2.6rem)}.panel{background:white;border:1px solid #dce4ec;border-radius:14px;padding:22px;margin:18px 0}label{display:block;font-weight:600;margin:12px 0 4px}input,select,button{font:inherit;padding:8px;border-radius:7px;border:1px solid #a9b8c7}input[type=range]{width:100%}button{background:#126b76;color:white;cursor:pointer}pre{background:#edf3f6;padding:16px;border-radius:8px;overflow:auto}canvas,svg{max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}small{color:#526577}</style><title>Selector de colores | Herramientas de aula</title></head><body><header><a href="../index.html#herramientas">← Biblioteca de herramientas</a></header><main><h1>Selector de colores</h1><p>Elige un color y consulta sus equivalencias para CSS y programación creativa.</p><div class="grid"><div class="panel"><label for="picker">Color</label><input id="picker" type="color" value="#126b76" style="width:100%;height:80px"><label for="hex">HEX</label><input id="hex" value="#126B76" maxlength="7"><label>RGB</label><output id="rgb"></output><label>HSL</label><output id="hsl"></output><p><button id="copy">Copiar HEX</button></p></div><div class="panel" id="sample" style="min-height:240px;display:grid;place-items:center"><strong id="contrast">Texto de muestra</strong></div></div></main><script>const p=document.getElementById('picker'),h=document.getElementById('hex'),s=document.getElementById('sample');function update(v){if(!/^#[0-9a-f]{6}$/i.test(v))return;p.value=v;h.value=v.toUpperCase();s.style.background=v;let [r,g,b]=[1,3,5].map(i=>parseInt(v.slice(i,i+2),16));document.getElementById('rgb').textContent='rgb('+r+', '+g+', '+b+')';let a=[r,g,b].map(x=>x/255),max=Math.max(...a),min=Math.min(...a),d=max-min,l=(max+min)/2,hh=0,ss=0;if(d){ss=d/(1-Math.abs(2*l-1));switch(max){case a[0]:hh=((a[1]-a[2])/d)%6;break;case a[1]:hh=(a[2]-a[0])/d+2;break;default:hh=(a[0]-a[1])/d+4}hh=(hh*60+360)%360}document.getElementById('hsl').textContent='hsl('+Math.round(hh)+', '+Math.round(ss*100)+'%, '+Math.round(l*100)+'%)';document.getElementById('contrast').style.color=(r*.299+g*.587+b*.114)>150?'#111':'#fff'}p.oninput=()=>update(p.value);h.oninput=()=>update(h.value);document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(h.value);update(p.value);</script></body></html>

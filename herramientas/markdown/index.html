<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; worker-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Convertir a Markdown</title>
  <style>
    :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #172031; background: #f1f3f7; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 760px); margin: clamp(2rem, 8vh, 5rem) auto; }
    h1 { margin: 0; font-size: clamp(2.15rem, 6vw, 3.8rem); line-height: 1.08; letter-spacing: -.055em; }
    p { margin: .65rem 0 0; }
    .muted { color: #48566a; }
    .panel { margin-top: 1.6rem; padding: clamp(1rem, 4vw, 1.75rem); background: #fff; border: 1px solid #dbe1eb; border-radius: 18px; }
    .picker { display: block; position: relative; padding: 1.25rem; border: 2px dashed #9ba9c3; border-radius: 12px; background: #f8faff; cursor: pointer; }
    .picker:hover, .picker:focus-within { border-color: #2449b2; background: #eef3ff; }
    .picker strong { display: block; font-size: 1.05rem; }
    .picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .picker:has(input:disabled) { opacity: .65; }
    .formats { font-size: .9rem; }
    .filename { overflow-wrap: anywhere; }
    button, .download { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: .55rem .95rem; border: 1px solid #2449b2; border-radius: 8px; background: #2449b2; color: #fff; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #a65a02; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; margin-top: .9rem; }
    #status { min-height: 1.55em; }
    #status[data-error="true"] { color: #9b202a; }
    #result label { display: block; margin-bottom: .5rem; font-weight: 650; }
    textarea { width: 100%; min-height: 250px; resize: vertical; padding: .9rem; border: 1px solid #b6c2d3; border-radius: 8px; color: #172031; background: #fcfdff; font: .9rem/1.55 ui-monospace, monospace; }
  </style>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>Convertir a Markdown</h1>
    <p class="muted">El archivo se procesa en tu navegador y permanece en tu dispositivo.</p>
    <section class="panel" aria-label="Archivo de origen">
      <label class="picker">
        <strong>Elegir archivo</strong>
        <span class="formats muted" id="formats">PDF con texto, DOCX, PPTX, XLSX, TXT y MD</span>
        <input id="file" type="file" accept=".pdf,.docx,.pptx,.xlsx,.txt,.md" aria-describedby="formats">
      </label>
      <p class="filename" id="filename" hidden></p>
      <div class="actions">
        <button type="button" id="convert" disabled>Convertir</button>
      </div>
      <p class="muted" id="status" role="status"></p>
      <noscript>Activa JavaScript para convertir archivos en el navegador.</noscript>
    </section>
    <section class="panel" id="result" hidden>
      <label for="markdown">Vista previa del Markdown</label>
      <textarea id="markdown" readonly spellcheck="false"></textarea>
      <div class="actions"><a class="download" id="download" download>Descargar .md</a></div>
    </section>
  </main>
</body>
</html>
